name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [release]   # push main -> release to get a fresh build
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14   # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - id: ver
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Build Voice Enhancer (dmg + zip, arm64)
        run: npx electron-builder --mac dmg zip --arm64 --publish never
      - name: Smoke-test bundled ffmpeg
        run: |
          APP="dist/mac-arm64/Voice Enhancer.app"
          FF="$APP/Contents/Resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg"
          "$FF" -hide_banner -filters | grep -E " (arnndn|deesser|loudnorm) "
          "$FF" -hide_banner -encoders | grep libmp3lame
          ls -la "$APP/Contents/Resources/voice-denoise.rnnn"
          codesign -dv "$APP" 2>&1 | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: Voice-Enhancer-mac-arm64
          path: |
            dist/*.dmg
            dist/*.zip
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: Voice Enhancer ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            macOS (Apple Silicon) build. Download the .dmg, open it and drag Voice Enhancer to Applications.
            First launch: right-click the app and choose Open (it is not signed with an Apple developer ID).
          files: |
            dist/*.dmg
            dist/*.zip
